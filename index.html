<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: a temple at night. Embers rise behind one centred column; every result is a collectible card that flips into view, framed by its rarity.
   A deliberate single dark look: lamplight only reads against the dark. */
:root {
  color-scheme: dark;
  --night: #0E0C22;
  --night-2: #1A1640;
  --panel: rgba(32, 27, 72, 0.66);
  --panel-solid: #1E1A44;
  --line: rgba(255, 214, 150, 0.16);
  --ink: #F4EFFF;
  --muted: #B6AFD8;
  --saffron: #FF8A1F;
  --marigold: #FFB938;
  --kumkum: #E5484D;
  --gold: #F4CF6B;
  --r-common: #8FA6C8; --r-rare: #F59A3C; --r-epic: #B970EA; --r-legendary: #2FC9BD; --r-champion: #F4CF6B;
  --frame: var(--marigold);
  --font-display: "Yatra One", "Mukta", Georgia, serif;
  --font-body: "Mukta", "Segoe UI", system-ui, sans-serif;
}
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
* { box-sizing: border-box; }
html { background: var(--night); }
body {
  background: radial-gradient(120% 70% at 50% -10%, #2C2266 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 64px 64px; min-height: 100vh; overflow-x: hidden;
}
#embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
main { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; overflow-x: clip; overflow-y: visible; padding-block: 8px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.3rem, 8vw, 3.6rem); }
h2 { font-size: clamp(1.5rem, 5vw, 2rem); }
h3 { font-size: 1.3rem; }
p { margin: 0; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--marigold); font-weight: 700; }
.center { text-align: center; }
.lede { color: var(--muted); max-width: 56ch; font-size: 1.05rem; }
.meta { font-size: 0.92rem; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.qnav { display: flex; justify-content: space-between; gap: 12px; }
.link-btn { font: inherit; font-size: 0.92rem; font-weight: 700; color: var(--muted); background: none; border: 0; padding: 8px 4px; cursor: pointer; }
.link-btn:hover:not(:disabled) { color: var(--marigold); }
.link-btn:disabled { opacity: .35; cursor: default; }
.link-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
.mini-locked { opacity: .35; filter: grayscale(.85); }
.why { display: grid; gap: 14px; }
.cmp { display: grid; gap: 7px; margin-top: 4px; }
.cmp-legend { display: flex; gap: 16px; font-size: 0.82rem; color: var(--muted); }
.lg::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.lg.them::before { background: var(--c); } .lg.me::before { background: var(--ink); }
.cmp-row { display: grid; grid-template-columns: 6.4rem 1fr; gap: 10px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.cmp-bars { display: grid; gap: 3px; }
.cmp .fill.them { background: var(--c); } .cmp .fill.me { background: var(--ink); opacity: .85; }
.more-btn { align-self: flex-start; margin-top: 6px; }
.more-wrap { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.more-wrap[hidden] { display: none; }
@media (max-width: 560px) { .more-wrap { grid-template-columns: 1fr; } }
.link-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 0.88rem; font-weight: 700; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 6px; border-radius: 999px; border: 1.5px solid color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
.chip svg { width: 22px; height: 22px; color: var(--c); stroke-width: 6; }
.chip:hover { background: color-mix(in srgb, var(--c) 24%, transparent); }
.chip:focus-visible, details.draw summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.draws { display: grid; gap: 12px; }
details.draw summary { cursor: pointer; list-style-position: inside; }
details.draw[open] { gap: 10px; }
.qa { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; }
.qa li { display: grid; gap: 2px; }
.qa .q { color: var(--muted); font-size: 0.9rem; }
.qa .a { font-weight: 500; }
.near-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .near-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.near { display: flex; flex-direction: column; gap: 6px; text-align: center; }
.near-pct { font-size: 0.85rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.why p { max-width: 62ch; }
.quiz-share { align-items: center; }
.lang-toggle { position: absolute; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  font-weight: 700; font-size: 0.92rem; color: var(--ink); text-decoration: none; padding: 7px 14px; border-radius: 999px;
  background: rgba(20, 16, 50, .7); border: 1.5px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.lang-toggle:hover { border-color: var(--marigold); }
.lang-toggle:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
:lang(hi) body { line-height: 1.75; }
/* Letter-spacing breaks Devanagari letters apart, so Hindi labels drop it. */
:lang(hi) .eyebrow, :lang(hi) .badge, :lang(hi) .lsl b, :lang(hi) .block h4, :lang(hi) .rl, :lang(hi) .locked, :lang(hi) .stat, :lang(hi) .match { letter-spacing: 0; }
:lang(hi) .eyebrow, :lang(hi) .lsl b, :lang(hi) .block h4 { font-size: 0.9rem; }

/* Buttons */
.btn { position: relative; overflow: hidden; font: inherit; font-weight: 700; cursor: pointer; border-radius: 14px; padding: 14px 28px; border: 0;
  background: linear-gradient(135deg, var(--saffron), var(--marigold)); color: #2A1400;
  box-shadow: 0 10px 30px -10px rgba(255, 138, 31, 0.7); transition: transform .2s ease, box-shadow .2s ease; }
.btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); transform: translateX(-120%); }
.btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -10px rgba(255, 138, 31, 0.85); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.btn.ghost::after { display: none; }
.btn:focus-visible, .opt:focus-visible, .mini-btn:focus-visible, .sbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* Hero */
.hero { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px; padding-top: 24px; }
.hero-mandala { position: absolute; top: -40px; left: 50%; width: min(560px, 100%); aspect-ratio: 1; transform: translateX(-50%); color: var(--gold); opacity: .16; pointer-events: none; }
.hero-mandala svg { width: 100%; height: 100%; }
.hero h1 .w { display: inline-block; }
.hero h1 .w.glow { color: var(--marigold); text-shadow: 0 0 28px rgba(255, 185, 56, .55); }
.rarity-key { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; list-style: none; padding: 0; margin: 0; }
.rarity-key li { font-size: 0.82rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; color: var(--c);
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); font-variant-numeric: tabular-nums; }
.fan { position: relative; width: 100%; height: 250px; margin-top: 8px; }
.fan-card { position: absolute; left: 50%; top: 10px; width: 150px; transform: translateX(-50%) translateX(var(--dx)) rotate(var(--rot)); }
.fan-card:nth-child(2) { z-index: 2; top: 0; }
@media (max-width: 480px) { .fan { height: 210px; } .fan-card { width: 124px; transform: translateX(-50%) translateX(calc(var(--dx) * .78)) rotate(var(--rot)); } }

/* Card face */
.face { --c: var(--frame); position: relative; isolation: isolate; border-radius: 22px; border: 2px solid var(--c); overflow: hidden;
  background: radial-gradient(130% 70% at 50% 0%, color-mix(in srgb, var(--c) 26%, var(--panel-solid)) 0%, var(--panel-solid) 60%);
  box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset, 0 28px 70px -24px color-mix(in srgb, var(--c) 70%, transparent);
  display: flex; flex-direction: column; align-items: center; text-align: center; }
.face.champion::before, .face.legendary::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, color-mix(in srgb, var(--c) 30%, transparent) 48%, rgba(255,255,255,.12) 50%, transparent 62%);
  background-size: 250% 100%; }
.face-top { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.badge { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 10px; border-radius: 6px; }
.badge.rar { background: var(--c); color: #160F2E; }
.badge.fac { border: 1px solid var(--line); color: var(--muted); }
.stars { color: var(--c); letter-spacing: 2px; font-size: 0.8rem; }
.medal { position: relative; width: 150px; aspect-ratio: 1; border-radius: 50%; flex: none;
  background: conic-gradient(from var(--spin), var(--c), transparent 25%, var(--c) 50%, transparent 75%, var(--c)); padding: 5px; }
.medal-in { position: relative; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2A2460, #120F2C 70%);
  display: grid; place-items: center; overflow: hidden; }
.medal-in svg { position: absolute; inset: 8%; width: 84%; height: 84%; color: var(--c); opacity: .22; }
.medal-in svg.sym { inset: 20%; width: 60%; height: 60%; opacity: 1; color: var(--ink); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 90%, transparent)); }
.face.mini .medal-in svg.sym { inset: 18%; width: 64%; height: 64%; stroke-width: 5; }
.altname { color: var(--c); font-size: 1.15rem; font-weight: 500; margin-top: -10px; }
.glyph { position: relative; font-weight: 700; color: var(--ink); line-height: 1; text-shadow: 0 0 22px color-mix(in srgb, var(--c) 80%, transparent); padding: 0 10px; }
.face.big { padding: 22px clamp(18px, 5vw, 34px) 26px; gap: 14px; }
.face.big .name { font-size: clamp(2.2rem, 9vw, 3.2rem); text-shadow: 0 0 30px color-mix(in srgb, var(--c) 45%, transparent); }
.face.big .epithet { color: var(--muted); font-size: 1.05rem; margin-top: -8px; }
.match { font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.lsl { width: 100%; display: grid; gap: 10px; text-align: left; }
.lsl div { border-radius: 12px; padding: 10px 14px; background: color-mix(in srgb, var(--k) 10%, transparent); border: 1px solid color-mix(in srgb, var(--k) 30%, transparent); min-width: 0; }
.lsl b { display: block; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--k); }
.stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; border-top: 1px solid var(--line); padding-top: 14px; }
.stat { display: grid; grid-template-columns: 6rem 1fr; align-items: center; gap: 8px; font-size: 0.84rem; text-align: left; color: var(--muted); }
.track { height: 7px; border-radius: 5px; background: rgba(255,255,255,.08); overflow: hidden; }
.fill { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 60%, transparent), var(--c)); transform-origin: left; }
@media (max-width: 480px) { .stats { grid-template-columns: 1fr; } }
.face.mini { padding: 14px 8px 12px; gap: 6px; border-radius: 16px; border-width: 1.5px; }
.face.mini .medal { width: 64px; padding: 3px; }
.face.mini .glyph { font-size: 1.7rem; }
.face.mini .nm { font-size: 0.85rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.face.mini .rl { font-size: 0.66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--c); font-weight: 700; }
.fan .face.mini { padding: 18px 10px 16px; }
.fan .face.mini .medal { width: 92px; }
.fan .face.mini .glyph { font-size: 2.4rem; }

/* Card back */
.back-face { --c: var(--gold); position: absolute; inset: 0; border-radius: 22px; border: 2px solid var(--gold); overflow: hidden;
  background: radial-gradient(circle at 50% 50%, #3A2C78, #15112F 70%); display: grid; place-items: center; color: var(--gold); }
.back-face svg { position: absolute; width: 90%; aspect-ratio: 1; opacity: .5; }
.back-face span { position: relative; font-family: var(--font-display); font-size: 2rem; text-shadow: 0 0 20px rgba(244, 207, 107, .6); }

/* Reveal stage */
.stage { position: relative; perspective: 1400px; display: grid; justify-items: center; }
.rays { position: absolute; left: 50%; top: 40%; width: 170%; aspect-ratio: 1; transform: translate(-50%, -50%); z-index: -1; pointer-events: none; opacity: .45;
  background: repeating-conic-gradient(from var(--spin), color-mix(in srgb, var(--frame) 70%, transparent) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 10%, transparent 62%); mask: radial-gradient(circle, #000 10%, transparent 62%); }
.flip { width: 100%; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out; }
.flip-inner { position: relative; transform-style: preserve-3d; transition: transform 1.1s cubic-bezier(.3, 1.35, .45, 1); }
.flip-inner.face-down { transform: rotateY(180deg); }
.flip-inner .front, .flip-inner .back-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.flip-inner .back-face { transform: rotateY(180deg); }
.glare { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; z-index: 3;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(255,255,255,.16), transparent 45%); }

/* Lotus progress */
.lotusbar { display: flex; justify-content: center; }
.lotusbar svg { width: 84px; height: 84px; overflow: visible; }
.petal { fill: rgba(255,255,255,.06); stroke: rgba(255,214,150,.35); stroke-width: 1.4; transition: fill .4s ease; }
.petal.open { fill: color-mix(in srgb, var(--marigold) 75%, var(--kumkum)); stroke: var(--gold); filter: drop-shadow(0 0 5px rgba(255,138,31,.6)); }
.petal.now { fill: rgba(255,185,56,.25); stroke: var(--marigold); }
.seed { fill: rgba(255,255,255,.12); }
.seed.open { fill: var(--gold); }
/* Diyas */
.diyas { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.diya { width: 28px; height: 34px; overflow: visible; }
.diya .flame { fill: rgba(255,255,255,.12); transform-origin: 15px 18px; transition: fill .4s ease; }
.diya .bowl { fill: rgba(255,255,255,.14); }
.diya.lit .flame { fill: var(--marigold); filter: drop-shadow(0 0 6px var(--saffron)); }
.diya.lit .bowl { fill: var(--kumkum); }
.diya.now .flame { fill: var(--marigold); opacity: .55; }
.progress-label { text-align: center; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-label .dev { color: var(--marigold); font-weight: 700; margin-right: 6px; }

/* Question */
.qwrap { display: flex; flex-direction: column; gap: 20px; }
.qpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 5vw, 32px);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 20px;
  box-shadow: 0 30px 80px -40px rgba(0,0,0,.8); }
.options { display: grid; gap: 10px; }
.opt { font: inherit; text-align: left; cursor: pointer; color: var(--ink); background: rgba(255,255,255,.04);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; gap: 14px; align-items: baseline;
  transition: border-color .2s ease, background .2s ease, transform .2s ease, opacity .25s ease, box-shadow .2s ease; }
.opt:hover { border-color: color-mix(in srgb, var(--marigold) 70%, transparent); background: rgba(255,185,56,.08); transform: translateX(4px); }
.opt .key { font-family: var(--font-display); color: var(--marigold); min-width: 1.2em; }
.opt.chosen { border-color: var(--marigold); background: rgba(255,185,56,.16); box-shadow: 0 0 0 4px rgba(255,185,56,.12), 0 0 30px -6px rgba(255,185,56,.6); transform: scale(1.02); }
.opt.dim { opacity: .3; }
.hint { font-size: 0.9rem; color: var(--muted); text-align: center; min-height: 1.5em; }
.hint b { color: var(--marigold); font-weight: 700; }

/* Result extras */
.result { display: flex; flex-direction: column; gap: 26px; }
.reveal-label { min-height: 1.4em; }
.share { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
.share-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.sbtn { font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; color: var(--ink);
  background: rgba(255,255,255,.05); border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 16px; transition: border-color .2s, transform .2s, background .2s; }
.sbtn:hover { border-color: var(--frame); background: color-mix(in srgb, var(--frame) 14%, transparent); transform: translateY(-2px); }
.sbtn.wa:hover { border-color: #25D366; } .sbtn.tg:hover { border-color: #2AABEE; }
.toast { font-size: 0.9rem; color: var(--marigold); text-align: center; min-height: 1.4em; }
.cardimg { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.cardimg img { width: min(340px, 100%); border-radius: 16px; box-shadow: 0 20px 50px -20px rgba(0,0,0,.8); }
.cardimg figcaption { font-size: 0.88rem; color: var(--muted); max-width: 46ch; }

.lore { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lore > * { min-width: 0; }
.lore-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
.lore-head::before, .lore-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); }
.lore-head h3 { color: var(--frame); text-align: center; }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.block.wide { grid-column: 1 / -1; }
.block h4 { margin: 0; font-size: 0.76rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--k, var(--marigold)); display: flex; align-items: center; gap: 8px; }
.block h4::before { content: ""; width: 8px; height: 8px; transform: rotate(45deg); background: var(--k, var(--marigold)); box-shadow: 0 0 10px var(--k, var(--marigold)); }
.block.story p { font-size: 1.06rem; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.facts li { padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
@media (max-width: 560px) { .lore { grid-template-columns: 1fr; } }

.mix { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 8.5rem 1fr 3rem; align-items: center; gap: 10px; font-size: 0.95rem; }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.note { font-size: 0.85rem; color: var(--muted); text-align: center; max-width: 60ch; margin: 0 auto; }

/* Collection */
.collection { display: flex; flex-direction: column; gap: 14px; }
.collection-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.95rem; }
.count b { color: var(--marigold); }
.cbar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.cbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--saffron), var(--gold)); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.mini-btn { all: unset; cursor: pointer; display: block; border-radius: 16px; transition: transform .2s ease; }
.mini-btn:hover { transform: translateY(-4px) rotate(-1deg); }
.locked { position: relative; height: 100%; min-height: 128px; border-radius: 16px; border: 1.5px dashed var(--line); display: grid; place-items: center; text-align: center;
  color: var(--muted); font-size: 0.7rem; letter-spacing: .12em; text-transform: uppercase; background: rgba(255,255,255,.02); }
.locked svg { position: absolute; width: 70%; aspect-ratio: 1; color: var(--line); }
.locked span { position: relative; }

/* Motion. Every element rests visible; animations only add life. */
@media (prefers-reduced-motion: no-preference) {
  .hero-mandala svg { animation: turn 140s linear infinite; }
  .hero h1 .w { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 90ms); }
  .hero .lede, .hero .row, .rarity-key { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: .45s; }
  .fan-card .face { animation: floaty 5s ease-in-out infinite alternate; animation-delay: var(--d); }
  .btn::after { animation: sheen 3.6s ease-in-out infinite; }
  .medal { animation: medal 6s linear infinite; }
  .face.champion::before, .face.legendary::before { animation: foil 4s ease-in-out infinite; }
  .rays { animation: medal 30s linear infinite; }
  .diya.lit .flame { animation: flicker 1.4s ease-in-out infinite alternate; }
  .petal.now { animation: breathe 1.6s ease-in-out infinite alternate; transform-box: fill-box; }
  @keyframes breathe { from { opacity: .55; } to { opacity: 1; } }
  .diya.now .flame { animation: flicker .9s ease-in-out infinite alternate; }
  .enter { animation: slideIn .45s cubic-bezier(.2,.8,.2,1) both; }
  .leave { animation: slideOut .3s ease-in forwards; }
  .opt { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(80ms + var(--i) * 70ms); }
  .opt:hover, .opt.chosen, .opt.dim { animation: none; }
  .revealing .fill { animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; animation-delay: 1.6s; }
  .after { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: 1.5s; }
  .fadein { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: .25; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  @keyframes sheen { 0%, 60% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
  @keyframes medal { to { --spin: 360deg; } }

const T = STRINGS[LANG];
const rarityLabel = r => T.rarity[r];
const factionLabel = f => T.faction[f] || f;
// The name shown on cards: English name, or the Devanagari name in Hindi.
const nm = c => (LANG === "hi" ? c.dev : c.name);
const isDeity = c => ["Deva", "Devi", "Avatar"].includes(c.f);
const SHADOW = new Set(["ravana", "kaikeyi", "duryodhana", "shakuni", "hiranyakashipu", "mahishasura", "kamsa", "ashwatthama"]);

// ---------- Characters and questions (loaded from data/) ----------
// Each character: p = profile on [dev, dha, jna, fie, ego, bond, joy, cun], each from -2 to 2.
let CHARS = [];
// Each answer nudges the eight qualities. Each person sees QUESTIONS_PER_QUIZ of these,
// chosen one at a time to tell apart the characters closest to their answers so far.
let QUESTIONS = [];

// ---------- Matching engine ----------
const vec = o => AXES.map(k => o[k] || 0);
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const norm = a => Math.sqrt(dot(a, a)) || 1;
function prepare() {
  CHARS.forEach(c => { c.u = c.p.map(v => v / norm(c.p)); });
  // Centre each question's answers so no option is worth more just for having bigger numbers.
  QUESTIONS.forEach(q => {
    const raw = q.a.map(o => vec(o[1]));
    const mean = AXES.map((_, i) => raw.reduce((s, e) => s + e[i], 0) / raw.length);
    q.v = raw.map(e => e.map((v, i) => v - mean[i]));
  });
}

// Which answer a character would most likely give.
function predict(c, q) {
  let best = 0, bv = -Infinity;
  q.v.forEach((e, i) => { const s = dot(c.p, e); if (s > bv) { bv = s; best = i; } });
  return best;
}
// Characters ranked by how closely they match the answers so far.
function rank(U) {
  const n = Math.sqrt(dot(U, U));
  return CHARS.map(c => ({ c, s: n ? dot(c.u, U) / n : 0 })).sort((x, y) => y.s - x.s);
}
// Pick the unasked question that best splits the current front-runners.
function pickNext(U, asked, rnd = Math.random) {
  const open = QUESTIONS.map((q, i) => i).filter(i => !asked.has(i));
  if (asked.size === 0) return open[Math.floor(rnd() * open.length)];
  const top = rank(U).slice(0, 8);
  const w = top.map(t => Math.exp(t.s * 6)); const W = w.reduce((a, b) => a + b, 0);
  const scored = open.map(i => {
    const q = QUESTIONS[i], dist = [0, 0, 0, 0];
    top.forEach((t, k) => { dist[predict(t.c, q)] += w[k] / W; });
    let h = 0; dist.forEach(p => { if (p > 0) h -= p * Math.log(p); });
    if (predict(top[0].c, q) !== predict(top[1].c, q)) h += 0.4;
    return { i, h };
  }).sort((a, b) => b.h - a.h);
  const pool = scored.slice(0, 3);
  return pool[Math.floor(rnd() * pool.length)].i;
}
const matchPct = s => Math.round(50 + 50 * s);

// ---------- Collection (kept in this browser only) ----------

function loadCollection() { try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch (e) { return new Set(); } }

function saveDraw(id, draw) { try { const all = loadDraws(); all[id] = [draw, ...(all[id] || [])].slice(0, 5); localStorage.setItem(DRAWS_KEY, JSON.stringify(all)); } catch (e) {} }
function saveCollection(set) { try { localStorage.setItem(STORE_KEY, JSON.stringify([...set])); } catch (e) {} }

const app = document.getElementById("app");
let byId = {};
const RCOL = { common: "#8FA6C8", rare: "#F59A3C", epic: "#B970EA", legendary: "#2FC9BD", champion: "#F4CF6B" };
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEV_DIGITS = "०१२३४५६७८९";
const devNum = n => String(n).split("").map(d => DEV_DIGITS[+d]).join("");
let state = null;
let collection = loadCollection();

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rc = r => `var(--r-${r})`;
const wait = ms => new Promise(r => setTimeout(r, calm ? 0 : ms));

// ---------- Ornaments ----------
function mandalaSVG() {
  let g = "";
  for (let i = 0; i < 16; i++) g += `<path transform="rotate(${i * 22.5})" d="M0 -30 C -9 -50, -7 -72, 0 -88 C 7 -72, 9 -50, 0 -30 Z"/>`;
  for (let i = 0; i < 8; i++) g += `<path transform="rotate(${i * 45 + 22.5})" d="M0 -18 C -10 -30, -9 -44, 0 -54 C 9 -44, 10 -30, 0 -18 Z"/>`;
  for (let i = 0; i < 48; i++) { const a = i * 7.5 * Math.PI / 180; g += `<circle cx="${(Math.sin(a) * 94).toFixed(1)}" cy="${(-Math.cos(a) * 94).toFixed(1)}" r="1.4" fill="currentColor"/>`; }
  return `<svg viewBox="-100 -100 200 200" aria-hidden="true" fill="none" stroke="currentColor" stroke-width=".7">
    <circle r="97"/><circle r="90"/><circle r="58"/><circle r="16"/>${g}</svg>`;
}
function yantraSVG() {
  let petals = "";
  for (let i = 0; i < 8; i++) petals += `<path transform="rotate(${i * 45})" d="M0 -36 C -6 -42, -6 -46, 0 -49 C 6 -46, 6 -42, 0 -36 Z"/>`;
  return `<svg viewBox="-50 -50 100 100" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
    <circle r="36"/><polygon points="0,-32 27.7,16 -27.7,16"/><polygon points="0,32 27.7,-16 -27.7,-16"/>${petals}</svg>`;
}
// Progress: a lotus that opens one petal per answer.
function diyas(step) {
  let petals = "";
  for (let i = 0; i < QUESTIONS_PER_QUIZ; i++) {
    const cls = i < step ? "open" : i === step ? "now" : "";
    petals += `<path class="petal ${cls}" transform="rotate(${i * 360 / QUESTIONS_PER_QUIZ} 50 50)" d="M50 46C42 36 42 20 50 6C58 20 58 36 50 46Z"/>`;
  }
  return `<div class="lotusbar"><svg viewBox="0 0 100 100" aria-hidden="true">${petals}<circle class="seed ${step >= QUESTIONS_PER_QUIZ ? "open" : ""}" cx="50" cy="50" r="7"/></svg></div>`;
}

// ---------- Cards ----------
const firstAkshara = w => { try { return [...new Intl.Segmenter("hi", { granularity: "grapheme" }).segment(w)][0].segment; } catch (e) { return w[0]; } };
const medalText = c => (LANG === "hi" ? firstAkshara(c.dev) : c.dev);
const glyphSize = c => (LANG === "hi" ? "4.2rem" : `${Math.max(1.5, 3.4 - Math.max(0, c.dev.length - 3) * 0.28).toFixed(2)}rem`);
function bigFace(c, pct) {
  return `<article class="face big ${c.r}" style="--c:${rc(c.r)}">
    <div class="face-top"><span class="badge rar">${rarityLabel(c.r)}</span><span class="stars" aria-hidden="true">${"◆".repeat(RARITY_ORDER[c.r])}</span><span class="badge fac">${factionLabel(c.f)}</span></div>
    <div class="medal"><div class="medal-in">${yantraSVG()}${symbolSVG(c.id)}</div></div>
    <h2 class="name">${nm(c)}</h2>
    <p class="altname">${LANG === "hi" ? c.name : c.dev}</p>
    <p class="epithet">${c.e}</p>
    ${pct != null ? `<p class="match">${T.match(pct)}</p>` : ""}
    <div class="lsl">
      <div style="--k:var(--marigold)"><b>${T.light}</b>${c.light}</div>
      <div style="--k:var(--r-epic)"><b>${T.shadow}</b>${c.shadow}</div>
      <div style="--k:var(--r-legendary)"><b>${T.lesson}</b>${c.lesson}</div>
    </div>
  </article>`;
}
function miniFace(c) {
  return `<div class="face mini ${c.r}" style="--c:${rc(c.r)}">
    <div class="medal"><div class="medal-in">${yantraSVG()}${symbolSVG(c.id)}</div></div>
    <span class="nm">${nm(c).replace("Hiranyakashipu", "Hiranya\u00ADkashipu")}</span><span class="rl">${rarityLabel(c.r)}</span></div>`;
}
const backFace = () => `<div class="back-face" aria-hidden="true">${mandalaSVG()}<span>इष्ट देवता</span></div>`;

function attachTilt(el) {
  if (calm || !matchMedia("(hover: hover)").matches) return;
  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.style.setProperty("--ry", `${(x - .5) * 12}deg`); el.style.setProperty("--rx", `${(.5 - y) * 10}deg`);
    el.style.setProperty("--gx", `${x * 100}%`); el.style.setProperty("--gy", `${y * 100}%`);
  });
  el.addEventListener("pointerleave", () => { el.style.setProperty("--ry", "0deg"); el.style.setProperty("--rx", "0deg"); });
}

// ---------- Embers and petals ----------
const fx = (() => {
  const cv = document.getElementById("embers"), ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1; const embers = [], petals = [];
  function size() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function ember(fresh) {
    return { x: Math.random() * W, y: fresh ? Math.random() * H : H + 10, r: .6 + Math.random() * 1.8, vy: .15 + Math.random() * .55,
      ph: Math.random() * 6.28, hue: 28 + Math.random() * 22, a: .25 + Math.random() * .55 };
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    for (const e of embers) {
      e.y -= e.vy; e.ph += .02; e.x += Math.sin(e.ph) * .3;
      if (e.y < -10) Object.assign(e, ember(false));
      const fl = .6 + .4 * Math.sin(e.ph * 3);
      ctx.fillStyle = `hsla(${e.hue},100%,62%,${e.a * fl})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 2.6, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.vy += .12; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1;
      if (p.life <= 0) { petals.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .45, 0, 0, 6.283); ctx.fill(); ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  if (!calm) {
    size(); addEventListener("resize", size);
    for (let i = 0; i < Math.round(Math.min(70, W / 14)); i++) embers.push(ember(true));
    requestAnimationFrame(draw);
  }
  return {
    burst(x, y, col) {
      if (calm) return;
      const cols = [col, "#FFB938", "#FF8A1F", "#E5484D", "#F4CF6B"];
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * 6.283, v = 4 + Math.random() * 9;
        petals.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
          s: 4 + Math.random() * 6, life: 90 + Math.random() * 60, col: cols[i % cols.length] });
      }
    },
  };
})();

function start() {
  state = { U: new Array(AXES.length).fill(0), asked: new Set(), step: 0, current: null, order: null, busy: false, hist: [] };
  nextQuestion();
  window.scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
}
function nextQuestion(again) {
  const qi = again ? again.qi : pickNext(state.U, state.asked);
  state.current = qi; state.order = again ? again.order : shuffle([0, 1, 2, 3]); state.busy = false;
  const q = QUESTIONS[qi];
  const lead = state.step >= 3 ? rank(state.U).slice(0, 2).map(t => t.c) : null;
  const opts = state.order.map((oi, k) =>
    `<button class="opt" data-o="${oi}" id="opt-${k}" style="--i:${k}"><span class="key">${"abcd"[k]}</span><span>${esc(q.a[oi][0])}</span></button>`).join("");
  app.innerHTML = `<section class="qwrap enter">
    ${diyas(state.step)}
    <p class="progress-label">${LANG === "hi" ? `<span class="dev">${T.qLabel(devNum(state.step + 1), devNum(QUESTIONS_PER_QUIZ))}</span>` : T.qLabel(state.step + 1, QUESTIONS_PER_QUIZ)}</p>
    <div class="qpanel">
      <h2>${esc(q.q)}</h2>
      <div class="options">${opts}</div>
    </div>
    <p class="hint">${lead ? T.hintLead(rarityLabel(lead[0].r), rarityLabel(lead[1].r)) : T.hintStart}</p>
    <div class="qnav"><button class="link-btn" id="qback" ${state.hist.length ? "" : "disabled"}>${T.back}</button><button class="link-btn" id="qquit">${T.quit}</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.o, b));
  document.getElementById("qback").onclick = goBack;
  document.getElementById("qquit").onclick = () => { state = null; renderIntro(); };
  app.querySelector(".opt").focus({ preventScroll: true });
}
// Undo the last answer and show that question again.
function goBack() {
  const h = state && state.hist.pop(); if (!h) return;
  state.U = h.U; state.asked.delete(h.qi); state.step--;
  nextQuestion(h);
}
async function answer(oi, btn) {
  if (state.busy) return; state.busy = true;
  app.querySelectorAll(".opt").forEach(b => b.classList.add(b === btn ? "chosen" : "dim"));
  const e = QUESTIONS[state.current].v[oi];
  state.hist.push({ U: state.U.slice(), qi: state.current, order: state.order, oi });
  state.U = state.U.map((v, i) => v + e[i]);
  state.asked.add(state.current);
  state.step++;
  await wait(320);
  app.querySelector(".qwrap").classList.add("leave");
  await wait(280);
  if (state.step < QUESTIONS_PER_QUIZ) nextQuestion(); else renderResult();
}

// The player's leanings on the same -2..2 scale as a character's profile.
const youScale = U => { const m = U.reduce((a, b) => a + b, 0) / AXES.length, d = U.map(v => v - m), mx = Math.max(...d.map(Math.abs)) || 1; return d.map(v => (v / mx) * 2); };
function compareHTML(c, U) {
  const y = youScale(U);
  const rows = AXES.map((k, i) => `<div class="cmp-row"><span class="cmp-k">${T.axis[k]}</span>
    <span class="cmp-bars"><span class="track"><span class="fill them" style="width:${((c.p[i] + 2) / 4) * 100}%"></span></span>
    <span class="track"><span class="fill me" style="width:${((y[i] + 2) / 4) * 100}%"></span></span></span></div>`).join("");
  return `<div class="cmp" style="--c:${rc(c.r)}"><div class="cmp-legend"><span class="lg them">${nm(c)}</span><span class="lg me">${T.you}</span></div>${rows}</div>`;

// Explains the result in plain words: the player's strongest leanings, and their closest deity when the card isn't one.
function whyHTML(top, ranked) {
  const mean = state.U.reduce((a, b) => a + b, 0) / AXES.length;
  const lean = AXES.map((k, i) => [k, state.U[i] - mean]).sort((a, b) => b[1] - a[1]);
  const up = lean.slice(0, 2).map(([k]) => T.axis[k]), down = T.axis[lean[lean.length - 1][0]];
  let ishta = "";
  if (!isDeity(top)) {
    const god = ranked.find(t => isDeity(t.c));
    ishta = `<div class="block" style="--k:var(--gold)"><h4>${T.ishtaTitle}</h4>
      <p>${SHADOW.has(top.id) ? T.shadowCard(nm(top)) : T.notDeity(nm(top))} ${T.ishta(nm(god.c), matchPct(god.s))}</p>
      <div><button class="sbtn" id="see-ishta" data-id="${god.c.id}">${T.seeCard(nm(god.c))}</button></div></div>`;
  }
  return `<section class="why">
    <div class="block" style="--k:var(--r-legendary)"><h4>${T.whyTitle}</h4><p>${T.why(up, down, nm(top))}</p>
      <h4 style="--k:var(--marigold)">${T.youVs(nm(top))}</h4>${compareHTML(top, state.U)}</div>

}
async function renderResult() {

function wrapLines(ctx, text, maxW) {

async function drawCard(c) {
  try { await document.fonts.ready; } catch (e) {}
  const W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d"), frame = RCOL[c.r];
  const g = x.createRadialGradient(W / 2, 0, 60, W / 2, 380, 1150); g.addColorStop(0, "#33287A"); g.addColorStop(1, "#0E0C22");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // embers
  for (let i = 0; i < 90; i++) { x.fillStyle = `hsla(${30 + Math.random() * 20},100%,62%,${Math.random() * .5})`; x.beginPath(); x.arc(Math.random() * W, Math.random() * H, 1 + Math.random() * 3, 0, 6.283); x.fill(); }
  // rays
  x.save(); x.translate(W / 2, 360); x.globalAlpha = .18; x.fillStyle = frame;
  for (let i = 0; i < 24; i++) { x.rotate(Math.PI / 12); x.beginPath(); x.moveTo(0, 0); x.lineTo(-30, -700); x.lineTo(30, -700); x.fill(); }
  x.restore();

  // medallion

  x.textAlign = "center"; x.textBaseline = "alphabetic";
  x.fillStyle = frame; x.font = "700 34px Mukta, sans-serif"; x.fillText(`${"◆".repeat(RARITY_ORDER[c.r])}  ${rarityLabel(c.r).toUpperCase()}  ·  ${factionLabel(c.f).toUpperCase()}`, W / 2, 128);
  x.shadowColor = frame; x.shadowBlur = 40;
  if (c.id === "vishwamitra") { x.fillStyle = "#F4EFFF"; x.font = "700 230px Mukta, sans-serif"; x.fillText("ॐ", W / 2, 440); }
  else {
    const svg = symbolSVG(c.id).replace('class="sym" ', 'xmlns="http://www.w3.org/2000/svg" width="260" height="260" ').replace(/currentColor/g, "#F4EFFF");
    const img = new Image(); img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    try { await img.decode(); x.drawImage(img, W / 2 - 130, 230, 260, 260); } catch (e) {}
  }
  x.shadowBlur = 0; x.fillStyle = "#F4EFFF";
  x.font = "108px 'Yatra One', Georgia, serif"; x.fillText(nm(c), W / 2, 680);
  x.fillStyle = "#B6AFD8"; x.font = "40px Mukta, sans-serif"; x.fillText(`${LANG === "hi" ? c.name : c.dev} · ${c.e}`, W / 2, 745);
  let y = 850;
  for (const [label, text, col] of [[T.light.toUpperCase(), c.light, "#FFB938"], [T.shadow.toUpperCase(), c.shadow, "#B970EA"]]) {
    x.fillStyle = col; x.font = "700 30px Mukta, sans-serif"; x.fillText(label, W / 2, y); y += 50;
    x.fillStyle = "#F4EFFF"; x.font = "37px Mukta, sans-serif";
    for (const l of wrapLines(x, text, W - 220).slice(0, 2)) { x.fillText(l, W / 2, y); y += 48; }
    y += 34;
  }
  x.fillStyle = frame; x.font = "44px 'Yatra One', Georgia, serif"; x.fillText(T.imgTagline, W / 2, H - 140);
  x.fillStyle = "#B6AFD8"; x.font = "30px Mukta, sans-serif"; x.fillText(T.imgFooter, W / 2, H - 92);
  return cv.toDataURL("image/png");
}

// A shared link like …#card-karna opens straight to that card.
function route() {
  const m = /^#card-([a-z]+)$/.exec(location.hash);
  if (m && byId[m[1]]) renderCardOnly(byId[m[1]], true); else renderIntro();
}
async function boot() {
  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
  try {
    const files = ["data/characters.json", "data/questions.json"];
    if (LANG === "hi") files.push("data/hi/characters.json", "data/hi/questions.json");
    const [chars, qs, hiChars, hiQs] = await Promise.all(files.map(get));
    CHARS = chars; QUESTIONS = qs;
    if (hiChars) CHARS.forEach(c => Object.assign(c, hiChars[c.id] || {}));
    if (hiQs) QUESTIONS.forEach((q, i) => { if (!hiQs[i]) return; q.q = hiQs[i].q; q.a = q.a.map((o, k) => [hiQs[i].a[k] || o[0], o[1]]); });
  } catch (e) { app.innerHTML = `<p class="center lede">${T.loadFail}</p>`; return; }
  prepare();
  byId = Object.fromEntries(CHARS.map(c => [c.id, c]));
  window.addEventListener("hashchange", route);
  route();
}
function langSwitch() {
  document.documentElement.lang = LANG;
  if (LANG === "hi") document.title = "अपना इष्ट देवता खोजें";
  const other = LANG === "hi" ? "en" : "hi";
  const a = document.createElement("a");
  a.className = "lang-toggle"; a.textContent = T.switchTo; a.setAttribute("aria-label", T.switchLabel);
  a.href = `?lang=${other}${location.hash}`;
  a.addEventListener("click", () => { try { localStorage.setItem("ishta-lang", other); } catch (e) {} });
  window.addEventListener("hashchange", () => { a.href = `?lang=${other}${location.hash}`; });
  document.body.appendChild(a);
}
langSwitch();
boot();
}
